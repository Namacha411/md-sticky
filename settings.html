<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設定</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>

  <body>
    <h1>設定</h1>

    <section>
      <h2>文字</h2>
      <div class="group">
        <label class="row">
          <span>本文のフォント</span>
          <input id="font-body" list="fonts" placeholder="既定 (Segoe UI)" autocomplete="off" />
        </label>
        <label class="row">
          <span>コードのフォント</span>
          <input id="font-code" list="fonts" placeholder="既定 (Cascadia Mono)" autocomplete="off" />
        </label>
        <label class="row">
          <span>文字サイズ</span>
          <span class="range">
            <input id="font-size" type="range" min="10" max="32" step="1" />
            <output id="font-size-value"></output>
          </span>
        </label>
        <div class="preview" id="preview">
          <p class="preview-heading">見出し Heading</p>
          <p>あいうえお 漢字 ABC abc 0123</p>
          <p><code>const x = 1; // コード</code></p>
        </div>
      </div>
      <datalist id="fonts"></datalist>
    </section>

    <section>
      <h2>新しい付箋</h2>
      <div class="group">
        <div class="row">
          <span>色</span>
          <div class="swatches" id="swatches"></div>
        </div>
        <label class="row">
          <span>不透明度</span>
          <span class="range">
            <input id="note-alpha" type="range" min="0.2" max="1" step="0.05" />
            <output id="note-alpha-value"></output>
          </span>
        </label>
      </div>
    </section>

    <section>
      <h2>起動</h2>
      <div class="group">
        <label class="row">
          <span>Windows へのサインイン時に起動する</span>
          <input id="autostart" type="checkbox" class="toggle" />
        </label>
      </div>
    </section>

    <p class="error" id="error" hidden></p>
  </body>
</html>
