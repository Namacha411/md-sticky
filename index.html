<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>md-sticky</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="note">
      <header class="header" data-tauri-drag-region>
        <button class="icon-btn" id="btn-new" title="新しいメモ (Ctrl+N)">&#xE710;</button>
        <div class="spacer" data-tauri-drag-region></div>
        <button class="icon-btn" id="btn-menu" title="メニュー">&#xE712;</button>
        <button class="icon-btn" id="btn-close" title="閉じる (Ctrl+W)">&#xE711;</button>
      </header>
      <div class="menu" id="menu" hidden>
        <div class="swatches" id="swatches"></div>
        <label class="menu-row">
          <span>不透明度</span>
          <input id="alpha" type="range" min="0.2" max="1" step="0.05" />
        </label>
        <button class="menu-item" id="btn-list">
          <span class="icon">&#xE8FD;</span>メモの一覧
        </button>
        <button class="menu-item" id="btn-settings">
          <span class="icon">&#xE713;</span>設定
        </button>
        <button class="menu-item" id="btn-delete">
          <span class="icon">&#xE74D;</span><span id="delete-label">メモの削除</span>
        </button>
      </div>
      <div class="editor" id="editor"></div>
      <div class="resize-grip" id="grip" title="サイズ変更"></div>
    </div>
  </body>
</html>
